<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMALI TECH MD - Bot Settings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0c15;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .card {
    background: rgba(18,22,31,0.95);
    border-radius: 2rem;
    padding: 2rem;
    max-width: 500px;
    width: 100%;
    border: 1px solid rgba(0,255,234,0.3);
  }
  .bot-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #00ffea;
    margin: 0 auto 1rem;
    display: block;
  }
  h2 {
    text-align: center;
    background: linear-gradient(135deg, #fff, #00ffea);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
  }
  label {
    display: block;
    margin: 1rem 0 0.3rem;
    font-weight: bold;
  }
  input, select {
    width: 100%;
    padding: 0.8rem;
    background: #11131f;
    border: 1px solid #2a2f3c;
    border-radius: 60px;
    color: #fff;
  }
  button {
    width: 100%;
    padding: 0.9rem;
    margin-top: 1.5rem;
    background: linear-gradient(135deg, #00ffea, #00b7ff);
    border: none;
    border-radius: 60px;
    font-weight: bold;
    cursor: pointer;
  }
  .message {
    text-align: center;
    margin-top: 1rem;
    color: #00ffea;
  }
</style>
</head>
<body>
<div class="card">
  <img src="https://i.ibb.co/XfYqpkmm/be2de0bd1b96.jpg" alt="JAMALI TECH MD" class="bot-avatar">
  <h2>Bot Settings</h2>
  
  <label><i class="fas fa-hashtag"></i> Bot Prefix</label>
  <input type="text" id="prefix" value=".">
  
  <label><i class="fas fa-eye"></i> Auto View Status</label>
  <select id="autoView">
    <option value="true">✅ Enabled</option>
    <option value="false">❌ Disabled</option>
  </select>
  
  <label><i class="fas fa-heart"></i> Auto Like Status</label>
  <select id="autoLike">
    <option value="true">✅ Enabled</option>
    <option value="false">❌ Disabled</option>
  </select>
  
  <button id="saveBtn"><i class="fas fa-save"></i> Save Settings</button>
  <div id="message" class="message"></div>
</div>

<script>
const number = new URLSearchParams(window.location.search).get('number');
document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!number) {
    document.getElementById('message').textContent = '❌ No bot number specified';
    return;
  }
  
  const settings = {
    PREFIX: document.getElementById('prefix').value,
    AUTO_VIEW_STATUS: document.getElementById('autoView').value,
    AUTO_LIKE_STATUS: document.getElementById('autoLike').value
  };
  
  const res = await fetch(`/api/settings/${number}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(settings)
  });
  
  const data = await res.json();
  document.getElementById('message').textContent = data.message || '✅ Settings saved!';
  setTimeout(() => document.getElementById('message').textContent = '', 3000);
});
</script>
</body>
</html>
