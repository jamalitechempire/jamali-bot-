<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMALI TECH MD - Admin Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0c15;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .card {
    background: rgba(18,22,31,0.95);
    border-radius: 2rem;
    padding: 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(0,255,234,0.3);
  }
  .bot-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid #00ffea;
    margin-bottom: 1rem;
  }
  h2 {
    background: linear-gradient(135deg, #fff, #00ffea);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
  }
  .input-group {
    position: relative;
    margin: 1rem 0;
  }
  .input-group i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #00ffea;
  }
  input {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 3rem;
    background: #11131f;
    border: 1px solid #2a2f3c;
    border-radius: 60px;
    color: #fff;
  }
  input:focus {
    outline: none;
    border-color: #00ffea;
  }
  button {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #00ffea, #00b7ff);
    border: none;
    border-radius: 60px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 1rem;
  }
  .error {
    color: #ff6b6b;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="card">
  <img src="https://i.ibb.co/XfYqpkmm/be2de0bd1b96.jpg" alt="JAMALI TECH MD" class="bot-avatar">
  <h2>ADMIN LOGIN</h2>
  <p>Enter credentials to access dashboard</p>
  
  <div class="input-group">
    <i class="fas fa-user"></i>
    <input type="text" id="username" placeholder="Username">
  </div>
  <div class="input-group">
    <i class="fas fa-key"></i>
    <input type="password" id="password" placeholder="Password">
  </div>
  
  <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
  <div id="errorMsg" class="error"></div>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  
  const data = await res.json();
  if (data.success) {
    window.location.href = '/admin';
  } else {
    document.getElementById('errorMsg').textContent = '❌ Invalid credentials';
  }
});
</script>
</body>
</html>
