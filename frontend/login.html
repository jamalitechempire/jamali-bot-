<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JAMALI TECH EMPIRE · Admin Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0c15;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  padding: 1.5rem;
}

/* Animated Empire Background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 255, 234, 0.12), transparent 55%),
    radial-gradient(circle at 85% 70%, rgba(0, 255, 234, 0.08), transparent 60%),
    radial-gradient(circle at 40% 80%, rgba(0, 200, 255, 0.1), transparent 45%),
    repeating-linear-gradient(45deg, rgba(0, 255, 234, 0.02) 0px, rgba(0, 255, 234, 0.02) 2px, transparent 2px, transparent 8px);
  animation: empireDrift 32s infinite alternate ease-in-out;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" opacity="0.06"><path fill="none" stroke="%2300ffea" stroke-width="1.2" d="M150 200 L250 150 L350 200 L400 280 L350 350 L250 400 L150 350 L100 280 L150 200Z M500 500 L580 470 L650 520 L630 610 L540 620 L480 580 L500 500Z M50 650 L120 620 L180 660 L140 730 L60 730 L30 670 L50 650Z"/><circle cx="700" cy="180" r="12" stroke="%2300ffea" fill="none" stroke-width="1.5"/><circle cx="80" cy="420" r="18" stroke="%2300ffea" fill="none" stroke-width="1"/></svg>') repeat;
  background-size: 180px;
  pointer-events: none;
  z-index: -1;
  opacity: 0.3;
}

@keyframes empireDrift {
  0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
  100% { transform: scale(1.05) rotate(3deg); opacity: 1; }
}

/* Particle Effect */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><circle cx="100" cy="200" r="2" fill="rgba(0,255,234,0.3)"/><circle cx="300" cy="500" r="1.5" fill="rgba(0,255,234,0.2)"/><circle cx="700" cy="300" r="2.5" fill="rgba(0,255,234,0.3)"/><circle cx="850" cy="700" r="1.8" fill="rgba(0,255,234,0.2)"/><circle cx="500" cy="800" r="2" fill="rgba(0,255,234,0.25)"/></svg>');
  background-repeat: repeat;
  opacity: 0.2;
}

/* Login Card */
.login-card {
  background: rgba(18, 20, 28, 0.9);
  backdrop-filter: blur(12px);
  border-radius: 2.5rem;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 450px;
  text-align: center;
  border: 1px solid rgba(0, 255, 234, 0.3);
  box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 234, 0.2) inset, 0 0 28px rgba(0, 255, 234, 0.2);
  transition: all 0.3s ease;
}

.login-card:hover {
  border-color: rgba(0, 255, 234, 0.6);
  box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1.5px rgba(0, 255, 234, 0.4) inset, 0 0 38px rgba(0, 255, 234, 0.3);
}

/* Bot Avatar */
.bot-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid #00ffea;
  box-shadow: 0 0 20px rgba(0, 255, 234, 0.4);
  object-fit: cover;
  margin-bottom: 1rem;
  transition: all 0.3s ease;
}

.bot-avatar:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px rgba(0, 255, 234, 0.7);
}

/* Empire Badge */
.empire-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  margin-bottom: 0.5rem;
}

.empire-badge i {
  font-size: 2rem;
  color: #00ffea;
  text-shadow: 0 0 8px #00ffea;
}

.login-card h2 {
  font-family: 'Orbitron', monospace;
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ffffff, #00ffea, #00b7ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: 1px;
  margin-bottom: 0.3rem;
}

.empire-sub {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
  color: #8a9bb5;
  border-top: 1px dashed rgba(0, 255, 234, 0.4);
  display: inline-block;
  padding-top: 0.5rem;
  margin-top: 0.5rem;
  margin-bottom: 1.8rem;
}

/* Input Groups */
.input-group {
  margin: 0.9rem 0;
  position: relative;
}

.input-group i {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: #00ffea;
  font-size: 1.1rem;
  opacity: 0.7;
  transition: 0.2s;
}

.login-card input {
  width: 100%;
  background: #111217;
  border: 1.5px solid #2a2a33;
  border-radius: 2rem;
  padding: 0.9rem 1rem 0.9rem 3rem;
  font-size: 1rem;
  font-weight: 500;
  color: #f0ede8;
  transition: all 0.25s ease;
  font-family: 'Poppins', monospace;
}

.login-card input:focus {
  outline: none;
  border-color: #00ffea;
  background: #0c0c12;
  box-shadow: 0 0 0 3px rgba(0, 255, 234, 0.2), 0 0 12px rgba(0, 255, 234, 0.3);
}

.login-card input::placeholder {
  color: #5e5a6e;
  font-weight: 400;
}

/* Login Button */
.ascend-btn {
  width: 100%;
  background: linear-gradient(105deg, #00b7ff, #00ffea, #00ffcc);
  border: none;
  border-radius: 3rem;
  padding: 1rem;
  margin-top: 1.5rem;
  font-size: 1.1rem;
  font-weight: 800;
  font-family: 'Orbitron', monospace;
  color: #0a0a10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3), 0 0 6px rgba(0, 255, 234, 0.6);
  letter-spacing: 0.5px;
}

.ascend-btn i {
  font-size: 1.1rem;
  transition: transform 0.2s;
}

.ascend-btn:hover {
  background: linear-gradient(105deg, #00ffea, #00ffcc, #7efff0);
  box-shadow: 0 8px 20px rgba(0, 255, 234, 0.5), 0 0 12px #00ffea;
  transform: translateY(-2px);
}

.ascend-btn:active {
  transform: translateY(1px);
}

.ascend-btn:disabled {
  background: #2a6a6a;
  box-shadow: none;
  cursor: not-allowed;
  opacity: 0.6;
  transform: none;
}

/* Error Message */
.error {
  color: #ff6b6b;
  background: rgba(30, 20, 20, 0.7);
  backdrop-filter: blur(4px);
  margin-top: 1rem;
  padding: 0.6rem;
  border-radius: 2rem;
  font-size: 0.8rem;
  font-weight: 600;
  border-left: 3px solid #ff6b6b;
  text-align: center;
  letter-spacing: 0.2px;
  transition: 0.2s;
}

/* Footer */
.empire-footer {
  margin-top: 2rem;
  font-size: 0.7rem;
  color: #7f7a6e;
  display: flex;
  justify-content: center;
  gap: 1rem;
  align-items: center;
  border-top: 1px solid rgba(0, 255, 234, 0.25);
  padding-top: 1rem;
  flex-wrap: wrap;
}

.empire-footer span i {
  font-size: 0.7rem;
  margin-right: 4px;
  color: #00ffea;
}

/* Responsive */
@media (max-width: 500px) {
  body {
    padding: 1rem;
  }
  .login-card {
    padding: 1.8rem 1.5rem;
    max-width: 100%;
  }
  .login-card h2 {
    font-size: 1.5rem;
  }
  .empire-badge i {
    font-size: 1.6rem;
  }
  .bot-avatar {
    width: 65px;
    height: 65px;
  }
}
</style>
</head>
<body>

<div class="particles"></div>

<div class="login-card">
  <!-- Bot Avatar -->
  <img src="https://i.ibb.co/XfYqpkmm/be2de0bd1b96.jpg" alt="JAMALI TECH MD" class="bot-avatar">
  
  <div class="empire-badge">
    <i class="fas fa-crown"></i>
    <i class="fas fa-microchip"></i>
    <i class="fas fa-shield-alt"></i>
  </div>
  
  <h2>JAMALI TECH<br>EMPIRE</h2>
  <div class="empire-sub">⚡ SECURE ADMIN ACCESS ⚡</div>

  <form id="login-form">
    <div class="input-group">
      <i class="fas fa-user-astronaut"></i>
      <input type="text" id="username" placeholder="Admin Username / ID" autocomplete="username" required>
    </div>
    <div class="input-group">
      <i class="fas fa-key"></i>
      <input type="password" id="password" placeholder="Access Password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="ascend-btn" id="loginBtn">
      <i class="fas fa-fingerprint"></i> ACCESS DASHBOARD <i class="fas fa-arrow-right"></i>
    </button>
    <div class="error" id="error-msg"></div>
  </form>
  
  <div class="empire-footer">
    <span><i class="fas fa-shield-alt"></i> Encrypted Channel</span>
    <span><i class="fas fa-lock"></i> JAMALI.SECURE</span>
    <span><i class="fab fa-whatsapp"></i> +255 784 062 158</span>
  </div>
</div>

<script>
// Login Form Handler
const form = document.getElementById('login-form');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const errorDiv = document.getElementById('error-msg');
const loginBtn = document.getElementById('loginBtn');

let isSubmitting = false;

function resetButtonState() {
  if (loginBtn) {
    loginBtn.disabled = false;
    loginBtn.innerHTML = `<i class="fas fa-fingerprint"></i> ACCESS DASHBOARD <i class="fas fa-arrow-right"></i>`;
  }
}

function setLoadingState() {
  if (loginBtn) {
    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> VERIFYING CREDENTIALS...`;
  }
}

function showError(message) {
  errorDiv.textContent = message || 'Access denied. Check credentials.';
  setTimeout(() => {
    if (errorDiv.textContent === message && !isSubmitting) {
      errorDiv.textContent = '';
    }
  }, 4000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (isSubmitting) return;
  
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  
  if (!username || !password) {
    showError('⚠️ Both credentials required to access the empire.');
    return;
  }
  
  isSubmitting = true;
  setLoadingState();
  errorDiv.textContent = '';
  
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await response.json();
    
    if (data && data.success === true) {
      window.location.href = '/admin';
      return;
    } else {
      const errMsg = data && data.message ? data.message : 'Invalid credentials. Access revoked.';
      showError(`❌ ${errMsg}`);
      resetButtonState();
      isSubmitting = false;
      
      // Shake effect
      const card = document.querySelector('.login-card');
      card.style.transform = 'translateX(5px)';
      setTimeout(() => { if(card) card.style.transform = ''; }, 100);
    }
  } catch (err) {
    console.error('Login error:', err);
    showError('⚠️ Gateway error. The empire\'s security core is unreachable.');
    resetButtonState();
    isSubmitting = false;
  }
});

// Session check - redirect if already logged in
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const sessionCheck = await fetch('/api/check-session', {
      method: 'GET',
      headers: { 'Cache-Control': 'no-cache' }
    });
    const sessionData = await sessionCheck.json();
    if (sessionData && sessionData.loggedIn === true) {
      window.location.href = '/admin';
    }
  } catch (err) {
    console.debug('Session check not available');
  }
  
  // Auto-focus on username field
  setTimeout(() => {
    if (usernameInput && document.activeElement !== usernameInput) {
      usernameInput.focus();
    }
  }, 100);
});

// Input field animations
const inputs = document.querySelectorAll('.input-group input');
inputs.forEach(input => {
  input.addEventListener('focus', () => {
    const parent = input.closest('.input-group');
    if(parent) parent.style.transform = 'scale(1.01)';
  });
  input.addEventListener('blur', () => {
    const parent = input.closest('.input-group');
    if(parent) parent.style.transform = '';
  });
});
</script>
</body>
</html>
