<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMALI TECH MD - Pair Code</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0c15;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .card {
    background: rgba(18,22,31,0.95);
    border-radius: 2rem;
    padding: 2rem;
    max-width: 450px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(0,255,234,0.3);
  }
  .bot-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid #00ffea;
    margin-bottom: 1rem;
  }
  h2 {
    background: linear-gradient(135deg, #fff, #00ffea);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
  }
  .input-group {
    position: relative;
    margin: 1.5rem 0;
  }
  .input-group i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #00ffea;
  }
  input {
    width: 100%;
    padding: 1rem 1rem 1rem 3rem;
    background: #11131f;
    border: 1px solid #2a2f3c;
    border-radius: 60px;
    color: #fff;
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: #00ffea;
  }
  button {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #00ffea, #00b7ff);
    border: none;
    border-radius: 60px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0,255,234,0.5);
  }
  .code-area {
    margin-top: 1.5rem;
    padding: 1rem;
    background: #0d0f18;
    border-radius: 1rem;
    display: none;
  }
  .code-value {
    font-size: 1.8rem;
    font-weight: bold;
    letter-spacing: 2px;
    color: #00ffea;
  }
  .error {
    color: #ff6b6b;
    margin-top: 1rem;
  }
  .footer {
    margin-top: 1.5rem;
    font-size: 0.7rem;
    color: #6c7a8e;
  }
</style>
</head>
<body>
<div class="card">
  <img src="https://i.ibb.co/XfYqpkmm/be2de0bd1b96.jpg" alt="JAMALI TECH MD" class="bot-avatar">
  <h2>JAMALI TECH EMPIRE</h2>
  <p>Enter your WhatsApp number to get pairing code</p>
  
  <div class="input-group">
    <i class="fas fa-phone-alt"></i>
    <input type="tel" id="phoneNumber" placeholder="255784062158">
  </div>
  
  <button id="generateBtn"><i class="fas fa-link"></i> GENERATE PAIR CODE</button>
  
  <div id="codeArea" class="code-area">
    <p>✅ PAIRING CODE GENERATED!</p>
    <div class="code-value" id="codeValue"></div>
    <p style="font-size: 0.7rem; margin-top: 0.5rem;">Use this code within 2 minutes</p>
  </div>
  <div id="errorMsg" class="error"></div>
  
  <div class="footer">
    <i class="fas fa-lock"></i> Pairing Code: JAMALITZ
  </div>
</div>

<script>
const phoneInput = document.getElementById('phoneNumber');
const generateBtn = document.getElementById('generateBtn');
const codeArea = document.getElementById('codeArea');
const codeValue = document.getElementById('codeValue');
const errorMsg = document.getElementById('errorMsg');

generateBtn.addEventListener('click', async () => {
  let number = phoneInput.value.trim().replace(/[^0-9]/g, '');
  if (!number || number.length < 9) {
    errorMsg.textContent = '❌ Enter a valid WhatsApp number';
    return;
  }
  
  errorMsg.textContent = '';
  codeArea.style.display = 'none';
  generateBtn.disabled = true;
  generateBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> GENERATING...';
  
  try {
    const res = await fetch(`/api/pair?number=${number}`);
    const data = await res.json();
    if (data.code) {
      codeValue.textContent = data.code;
      codeArea.style.display = 'block';
    } else {
      errorMsg.textContent = '❌ Pair code not generated. Try again.';
    }
  } catch (err) {
    errorMsg.textContent = '❌ Server error. Please try again.';
  } finally {
    generateBtn.disabled = false;
    generateBtn.innerHTML = '<i class="fas fa-link"></i> GENERATE PAIR CODE';
  }
});
</script>
</body>
</html>
